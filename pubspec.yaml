name: quizs
description: "Static Flutter implementation of the Quizs Figma designs."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.2
  firebase_crashlytics: ^4.3.10
  http: ^1.6.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/questions/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: Quizlo
      fonts:
        - asset: assets/fonts/Quizlo-DEMO.otf
    - family: HappySchool
      fonts:
        - asset: assets/fonts/Happy-School.ttf
    - family: DaysOne
      fonts:
        - asset: assets/fonts/DaysOne-Regular.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
    - family: Questrial
      fonts:
        - asset: assets/fonts/Questrial-Regular.ttf
