name: quizs
description: "Static Flutter implementation of the Quizs Figma designs."
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  unity_levelplay_mediation: ^9.2.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.2
  firebase_crashlytics: ^4.3.10
  firebase_messaging: ^15.2.5
  http: ^1.6.0
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^22.3.1
  image_picker: ^1.1.2
  audioplayers: ^6.8.1
  in_app_update: ^4.2.5
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo.png"
  adaptive_icon_background: "#6900C5"
  adaptive_icon_foreground: "logo.png"
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/sounds/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: Quizlo
      fonts:
        - asset: assets/fonts/Quizlo-DEMO.otf
    - family: HappySchool
      fonts:
        - asset: assets/fonts/Happy-School.ttf
    - family: DaysOne
      fonts:
        - asset: assets/fonts/DaysOne-Regular.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
    - family: Questrial
      fonts:
        - asset: assets/fonts/Questrial-Regular.ttf
