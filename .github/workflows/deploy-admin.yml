name: Update admin branch

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'

jobs:
  subtree-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push admin/ to admin branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin `git subtree split --prefix=admin main`:admin --force
